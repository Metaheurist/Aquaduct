[project]
name = "aquaduct"
version = "0.2.0"
description = "Local AI faceless short-form video generator"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "qt: PyQt6 UI tests (require display or pytest-qt)",
    "slow: long-running integration tests",
    "cuda_gpu: optional real-GPU smoke tests",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".venv-build", "build", "dist"]
# B615: Hub repo ids are user-selected at runtime, so revisions cannot be pinned in code.
skips = ["B615"]
